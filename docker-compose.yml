services:
  postgres:
    image: postgres:16-alpine
    container_name: salveregina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: salveregina_db
      POSTGRES_USER: salveregina
      POSTGRES_PASSWORD: salveregina_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salveregina -d salveregina_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
