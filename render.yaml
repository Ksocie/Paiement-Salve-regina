services:
  - type: web
    name: salve-regina-pwa
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: salveregina-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: salveregina-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: salveregina-postgres
          property: password
      - key: GENIUSPAY_MODE
        value: live
      - key: GENIUSPAY_API_KEY
        sync: false
      - key: GENIUSPAY_API_SECRET
        sync: false
      - key: GENIUSPAY_WEBHOOK_SECRET
        sync: false

databases:
  - name: salveregina-postgres
    databaseName: salveregina_db
    user: salveregina
    plan: free
    region: frankfurt
