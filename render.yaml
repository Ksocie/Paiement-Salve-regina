services:
  - type: web
    name: salve-regina-pwa
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: GENIUSPAY_MODE
        value: live
      - key: GENIUSPAY_API_KEY
        sync: false
      - key: GENIUSPAY_API_SECRET
        sync: false
      - key: GENIUSPAY_WEBHOOK_SECRET
        sync: false
