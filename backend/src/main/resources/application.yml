server:
  port: ${PORT:${SERVER_PORT:8082}}

spring:
  application:
    name: salve-regina-backend
  config:
    import:
      - optional:classpath:application-local.yml

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/salveregina_db}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:salveregina}
    password: ${SPRING_DATASOURCE_PASSWORD:salveregina_password}

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

geniuspay:
  mode: ${GENIUSPAY_MODE:live}
  api-url: ${GENIUSPAY_API_URL:https://geniuspay.ci/api/v1/merchant}
  api-key: ${GENIUSPAY_API_KEY:}
  api-secret: ${GENIUSPAY_API_SECRET:}
  webhook-secret: ${GENIUSPAY_WEBHOOK_SECRET:}

app:
  tresorerie:
    pin: ${APP_TRESORERIE_PIN:202620}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:8080}
